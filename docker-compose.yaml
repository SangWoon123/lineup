version: '3.8'
services:
    db:
        image: postgres:15
        container_name: nextjs_postgres
        restart: always
        environment:
            POSTGRES_USER: line
            POSTGRES_PASSWORD: 1234
            POSTGRES_DB: lineup
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
